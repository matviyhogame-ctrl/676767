name: Build Beer Visuals

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v3

      - name: Build mod
        working-directory: mod
        run: |
          if [ -f gradlew ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: beer-visuals-mod
          path: mod/build/libs/beer_visuals-*.jar
          if-no-files-found: error

  build-launcher:
    name: Build Electron Launcher (Windows portable)
    needs: build-mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: beer-visuals-mod
          path: launcher/resources/mods

      - name: Rename jar
        shell: bash
        run: |
          cd launcher/resources/mods
          jar=$(ls beer_visuals-*.jar | head -1)
          mv "$jar" beer_visuals.jar

      - name: Install & build
        working-directory: launcher
        run: |
          npm ci || npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: BeerVisuals-Windows
          path: launcher/dist/BeerVisuals.exe
          if-no-files-found: error
